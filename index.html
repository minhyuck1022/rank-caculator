<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>보안형 성적 순위 계산기</title>

<!-- CSS -->
<style>
body { font-family: Arial; background:#f6f6f6; display:flex; justify-content:center; align-items:center; height:100vh; }
.box { background:#fff; padding:20px; border-radius:10px; width:350px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
input { width:100%; padding:10px; margin:5px 0; }
button { width:100%; padding:10px; margin-top:5px; background:#4caf50; color:white; border:none; border-radius:5px; cursor:pointer; }
button:hover { background:#45a049; }
#logoutBtn { background:#d9534f; }
</style>

</head>
<body>

<!-- 로그인 화면 -->
<div id="login" class="box">
  <h2>로그인 / 회원가입</h2>
  <input id="email" placeholder="학번@school.com (이메일 형식)">
  <input id="password" type="password" placeholder="비밀번호">
  <button id="loginBtn">로그인</button>
  <button id="registerBtn">회원가입</button>
</div>

<!-- 메인 화면 -->
<div id="main" class="box" style="display:none;">
  <h2>성적 입력</h2>
  <input id="korean" placeholder="국어 점수">
  <input id="math" placeholder="수학 점수">
  <input id="english" placeholder="영어 점수">
  <button id="saveBtn">성적 저장</button>
  <div id="result" style="margin-top:10px;"></div>
  <button id="logoutBtn">로그아웃</button>
</div>

<!-- JS -->
<script type="module">
// ✅ Firebase SDK 로드
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } 
  from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import { getFirestore, setDoc, doc, getDoc } 
  from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

// 🔧 Firebase 설정 (본인 값으로 변경!)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginDiv = document.getElementById("login");
const mainDiv = document.getElementById("main");
const resultDiv = document.getElementById("result");

// 로그인
document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("email").value;
  const pw = document.getElementById("password").value;
  try {
    await signInWithEmailAndPassword(auth, email, pw);
    loginDiv.style.display = "none";
    mainDiv.style.display = "block";
  } catch {
    alert("회원이 없거나 비밀번호가 틀립니다.");
  }
};

// 회원가입
document.getElementById("registerBtn").onclick = async () => {
  const email = document.getElementById("email").value;
  const pw = document.getElementById("password").value;
  try {
    await createUserWithEmailAndPassword(auth, email, pw);
    alert("회원가입 완료! 로그인하세요.");
  } catch(e) {
    alert("회원가입 실패: " + e.message);
  }
};

// 로그아웃
document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
  mainDiv.style.display = "none";
  loginDiv.style.display = "block";
};

// 성적 저장
document.getElementById("saveBtn").onclick = async () => {
  const user = auth.currentUser;
  if (!user) return alert("로그인 필요");

  const scores = {
    korean: Number(document.getElementById("korean").value),
    math: Number(document.getElementById("math").value),
    english: Number(document.getElementById("english").value)
  };

  const total = Object.values(scores).reduce((a,b)=>a+b,0);
  const avg = (total/3).toFixed(2);

  await setDoc(doc(db, "grades", user.email), { scores, total, avg });

  resultDiv.innerHTML = `<b>총점:</b> ${total} <br><b>평균:</b> ${avg}`;
  alert("저장 완료!");
};

// 로그인 상태 변화 감지
onAuthStateChanged(auth, async user => {
  if (user) {
    loginDiv.style.display = "none";
    mainDiv.style.display = "block";
    const snap = await getDoc(doc(db, "grades", user.email));
    if (snap.exists()) {
      const data = snap.data();
      resultDiv.innerHTML = `<b>총점:</b> ${data.total} <br><b>평균:</b> ${data.avg}`;
    }
  } else {
    loginDiv.style.display = "block";
    mainDiv.style.display = "none";
  }
});
</script>

</body>
</html>
