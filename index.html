<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>성적 계산기 + 등수</title>
<style>
body { font-family: Arial; background:#f6f6f6; display:flex; justify-content:center; align-items:flex-start; padding-top:50px; }
.box { background:#fff; padding:20px; border-radius:10px; width:400px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
input { width:100%; padding:10px; margin:5px 0; }
button { width:100%; padding:10px; margin-top:5px; background:#4caf50; color:white; border:none; border-radius:5px; cursor:pointer; }
button:hover { background:#45a049; }
#error { color:red; margin-top:5px; }
</style>
</head>
<body>

<div id="login" class="box">
  <h2>사용자 이름 입력</h2>
  <input id="username" placeholder="학번 + 이름 입력">
  <button id="startBtn">시작</button>
</div>

<div id="main" class="box" style="display:none;">
  <h2>성적 입력</h2>
  <input id="korean" placeholder="국어 점수">
  <input id="math" placeholder="수학 점수">
  <input id="english" placeholder="영어 점수">
  <input id="earth" placeholder="지구 점수">
  <input id="biology" placeholder="생명 점수">
  <input id="physics" placeholder="물리 점수">
  <input id="chemistry" placeholder="화학 점수">
  <input id="statistics" placeholder="확통 점수">
  <input id="japanese" placeholder="일본어 점수">
  <button id="saveBtn">계산 및 저장</button>
  <div id="error"></div>
  <div id="result" style="margin-top:10px;"></div>
</div>

<script>
const loginDiv = document.getElementById("login");
const mainDiv = document.getElementById("main");
const resultDiv = document.getElementById("result");
const errorDiv = document.getElementById("error");

const startBtn = document.getElementById("startBtn");
const saveBtn = document.getElementById("saveBtn");

// 시작 버튼
startBtn.onclick = () => {
  const name = document.getElementById("username").value.trim();
  if (!name) return alert("이름을 입력하세요.");
  localStorage.setItem("username", name);
  loginDiv.style.display = "none";
  mainDiv.style.display = "block";
  displayPrevious();
};

// 점수 계산 및 저장
saveBtn.onclick = () => {
  const name = localStorage.getItem("username");
  if (!name) return alert("사용자 정보가 없습니다.");

  const fields = ["korean","math","english","earth","biology","physics","chemistry","statistics","japanese"];
  const scores = {};
  let valid = true;

  fields.forEach(f => {
    const val = Number(document.getElementById(f).value);
    if (isNaN(val) || val < 0 || val > 100) valid = false;
    scores[f] = val;
  });

  if (!valid) {
    errorDiv.textContent = "0~100 사이의 값으로 다시 입력하시오.";
    return;
  } else {
    errorDiv.textContent = "";
  }

  const total = Object.values(scores).reduce((a,b)=>a+b,0);
  const avg = (total/fields.length).toFixed(2);

  // LocalStorage에 저장
  let grades = JSON.parse(localStorage.getItem("grades")) || {};
  grades[name] = { scores, total, avg };
  localStorage.setItem("grades", JSON.stringify(grades));

  displayPrevious();
};

// 이전 데이터 + 등수 표시
function displayPrevious() {
  const name = localStorage.getItem("username");
  let grades = JSON.parse(localStorage.getItem("grades")) || {};
  if (!grades[name]) return;

  const data = grades[name];
  const subjects = Object.keys(data.scores);

  let resultHTML = "";
  subjects.forEach(sub => {
    // 등수 계산
    const sorted = Object.entries(grades).sort((a,b)=>b[1].scores[sub]-a[1].scores[sub]);
    const rank = sorted.findIndex(([n])=>n===name)+1;
    resultHTML += `<b>${sub}:</b> ${data.scores[sub]} (등수: ${rank})<br>`;
  });

  // 총점 등수
  const sortedTotal = Object.entries(grades).sort((a,b)=>b[1].total - a[1].total);
  const totalRank = sortedTotal.findIndex(([n])=>n===name)+1;

  resultHTML += `<b>총점:</b> ${data.total} (등수: ${totalRank})<br>`;
  resultHTML += `<b>평균:</b> ${data.avg}`;

  resultDiv.innerHTML = resultHTML;
}
</script>

</body>
</html>
